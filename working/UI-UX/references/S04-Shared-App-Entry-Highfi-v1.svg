<!-- Rules card -->
<rect x="1170" y="112" width="300" height="1110" rx="16" fill="#FBFDFC" stroke="#DDE8E6"/>
<text x="1200" y="155" class="ruleh" font-size="22">Visual Rules (Step 3)</text>

<circle cx="1200" cy="205" r="16" fill="#10998F"/><text x="1200" y="210" text-anchor="middle" class="num">1</text>
 <text x="1230" y="203" class="ruleh">整體風格</text>
 <text x="1230" y="229" class="ruleb">白 / 極淡灰為主，安靜、可信</text>
 <text x="1230" y="251" class="ruleb">不使用大面積漸層或浮誇效果</text><circle cx="1200" cy="317" r="16" fill="#10998F"/><text x="1200" y="322" text-anchor="middle" class="num">2</text>
 <text x="1230" y="315" class="ruleh">App Logo / Title</text>
 <text x="1230" y="341" class="ruleb">Logo 清楚但低調；Title 20–24px</text>
 <text x="1230" y="363" class="ruleb">不因等待 Logo 而延遲畫面</text><circle cx="1200" cy="429" r="16" fill="#10998F"/><text x="1200" y="434" text-anchor="middle" class="num">3</text>
 <text x="1230" y="427" class="ruleh">狀態文字</text>
 <text x="1230" y="453" class="ruleb">目前狀態是視覺第一主角</text>
 <text x="1230" y="475" class="ruleb">18–20px / semibold；輔助字 14px</text><circle cx="1200" cy="541" r="16" fill="#10998F"/><text x="1200" y="546" text-anchor="middle" class="num">4</text>
 <text x="1230" y="539" class="ruleh">Progress</text>
 <text x="1230" y="565" class="ruleb">Stage + % 或 Stage only</text>
 <text x="1230" y="587" class="ruleb">Track neutral；Fill Teal → Aqua</text><circle cx="1200" cy="653" r="16" fill="#10998F"/><text x="1200" y="658" text-anchor="middle" class="num">5</text>
 <text x="1230" y="651" class="ruleh">成功轉場</text>
 <text x="1230" y="677" class="ruleb">READY 後直接進 S03</text>
 <text x="1230" y="699" class="ruleb">不顯示 Success Card / Continue</text><circle cx="1200" cy="765" r="16" fill="#10998F"/><text x="1200" y="770" text-anchor="middle" class="num">6</text>
 <text x="1230" y="763" class="ruleh">Recovery</text>
 <text x="1230" y="789" class="ruleb">原地顯示錯誤訊息與操作</text>
 <text x="1230" y="811" class="ruleb">Retry Primary；Home 永遠可見</text><circle cx="1200" cy="877" r="16" fill="#10998F"/><text x="1200" y="882" text-anchor="middle" class="num">7</text>
 <text x="1230" y="875" class="ruleh">按鈕 / 互動</text>
 <text x="1230" y="901" class="ruleb">min-height ≥ 44px；radius 12px</text>
 <text x="1230" y="923" class="ruleb">Hover / Pressed / Focus / Disabled</text><circle cx="1200" cy="989" r="16" fill="#10998F"/><text x="1200" y="994" text-anchor="middle" class="num">8</text>
 <text x="1230" y="987" class="ruleh">Motion / Accessibility</text>
 <text x="1230" y="1013" class="ruleb">一般 180ms；progress ≤ 240ms</text>
 <text x="1230" y="1035" class="ruleb">reduced-motion；aria-live；focus handoff</text>

<rect x="1185" y="1040" width="270" height="150" rx="14" fill="#FFF9DE"/>
<text x="1210" y="1076" class="ruleh" fill="#805C13">💡 Design Intent</text>
<text x="1210" y="1106" class="ruleb">S04 像一個「非常短、很安心的開門畫面」：</text>
<text x="1210" y="1130" class="ruleb">讓 User 知道是哪個 App、現在在做什麼；</text>
<text x="1210" y="1154" class="ruleb">成功立即消失進 S03，失敗就在原位置給出口。</text>

<text x="34" y="1332" class="panelsub">NodeFF · No install · Everyone is the creator · Sharable · Intent Commerce · Fun and sociable.</text>
<text x="1460" y="1332" text-anchor="end" class="panelsub">S04 · High-fidelity Visual Reference · Step 4</text>
</svg>